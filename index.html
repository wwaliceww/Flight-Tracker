<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alice & Theo Flight Tracker – 3D Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    body { margin:0; background:black; }
    #globeViz { width:100vw; height:100vh; }
  </style>
</head>

<body>
<div id="globeViz"></div>

<script>
const flights = [

  // EXISTING (keep yours as-is above this line if needed)

  // ✅ NEW FLORENCE TRIP
  {
    date:"2026-04-01",
    fromCity:"Copenhagen",
    fromLat:55.6180,
    fromLng:12.6508,
    toCity:"Florence",
    toLat:43.7696,
    toLng:11.2558,
    distance_km:1317,
    duration_min:180,
    who:"him",
    notes:"Pesach trip 🍝"
  },
  {
    date:"2026-04-01",
    fromCity:"Milan",
    fromLat:45.4451,
    fromLng:9.2767,
    toCity:"Florence",
    toLat:43.7696,
    toLng:11.2558,
    distance_km:315,
    duration_min:105,
    who:"her",
    notes:""
  },

  // ✅ AMSTERDAM TRIP
  {
    date:"2026-04-25",
    fromCity:"Copenhagen",
    fromLat:55.6180,
    fromLng:12.6508,
    toCity:"Amsterdam",
    toLat:52.3676,
    toLng:4.9041,
    distance_km:649,
    duration_min:120,
    who:"him",
    notes:"Kingsday 👑"
  },
  {
    date:"2026-04-26",
    fromCity:"Milan",
    fromLat:45.4451,
    fromLng:9.2767,
    toCity:"Amsterdam",
    toLat:52.3676,
    toLng:4.9041,
    distance_km:833,
    duration_min:125,
    who:"her",
    notes:""
  }
];

// 🌍 GLOBE (clean + reliable setup)
const globe = Globe()
(document.getElementById("globeViz"))
.globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
.backgroundColor("#000")
.arcStartLat(d => d.fromLat)
.arcStartLng(d => d.fromLng)
.arcEndLat(d => d.toLat)
.arcEndLng(d => d.toLng)
.arcColor(d => d.who === "her" ? "#c084fc" : "#60a5fa")
.arcAltitude(0.25)
.arcStroke(1.5)
.arcsData(flights);

// camera
globe.pointOfView({ lat: 20, lng: 0, altitude: 2 });

</script>
</body>
</html>
